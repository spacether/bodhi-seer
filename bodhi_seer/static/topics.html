<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bodhi Seer Topics</title>
  <style>
    :root {
      --bg: #f4efe9;
      --panel: rgba(255, 255, 255, 0.82);
      --ink: #1d2430;
      --muted: #5b6472;
      --line: rgba(29, 36, 48, 0.12);
      --accent: #2b6cb0;
      --accent-soft: rgba(43, 108, 176, 0.1);
      --shadow: 0 20px 40px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8f4ef 0%, #e8ebef 100%);
      color: var(--ink);
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: -0.04em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 14px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 220px;
    }
    .card h2 {
      margin: 0;
      line-height: 1.2;
      font-size: 1.4rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .pill {
      display: inline-block;
      border-radius: 999px;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 6px 10px;
    }
    .query {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    a.button {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }
    a.button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    button.button.delete {
      border: 1px solid rgba(175, 54, 54, 0.45);
      background: rgba(175, 54, 54, 0.08);
      color: #7d2020;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .toolbar {
      margin-bottom: 26px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .toolbar form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .field input, .field select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
    }
    .button.primary {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 11px 18px;
      cursor: pointer;
    }
    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
      color: var(--muted);
    }
    code {
      font-family: "SFMono-Regular", Menlo, Monospace;
      background: rgba(0,0,0,0.04);
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1>Topics</h1>
      <span class="badge">Bodhi Seer</span>
    </div>

    <div class="toolbar">
      <form id="topic-form">
        <div class="field">
          <label for="topic-name">Topic</label>
          <input id="topic-name" name="name" placeholder="e.g. Chicago biotech" required>
        </div>
        <div class="field">
          <label for="topic-days">Days</label>
          <input id="topic-days" name="days" type="number" min="1" max="365" value="30">
        </div>
        <div class="field">
          <label for="topic-language">Language</label>
          <select id="topic-language" name="language">
            <option value="english">English</option>
            <option value="french">French</option>
            <option value="spanish">Spanish</option>
            <option value="german">German</option>
            <option value="arabic">Arabic</option>
          </select>
        </div>
        <div class="field">
          <label for="source-scope">Sources</label>
          <select id="source-scope" name="source_mode">
            <option value="news">News sources only</option>
            <option value="all">All sources</option>
          </select>
        </div>
        <div class="field">
          <label for="source-location">Location (optional)</label>
          <input id="source-location" name="location" placeholder="Chicago">
        </div>
        <div class="field">
          <button class="button primary" type="submit">Add topic</button>
        </div>
      </form>
    </div>

    <div id="topics" class="grid" aria-live="polite"></div>
  </div>

  <script>
    const cards = document.getElementById('topics');

    function fmtDate(iso) {
      if (!iso) return 'never';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return 'unknown';
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function createTopic(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = {
        name: form.name.value.trim(),
        days: Number(form.days.value || 30),
        language: form.language.value,
        source_mode: form.source_mode.value,
        location: form.location.value.trim() || null,
      };
      if (!payload.name) {
        window.alert('Please enter a topic name.');
        return;
      }
      try {
        const response = await fetch('/api/topics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error(detail || 'Failed to create topic');
        }
        form.reset();
        form.days.value = 30;
        form.language.value = 'english';
        form.source_mode.value = 'news';
        await loadTopics();
      } catch (error) {
        window.alert(`Failed to add topic: ${error.message}`);
      }
    }

    async function loadTopics() {
      try {
        const response = await fetch('/api/topics');
        if (!response.ok) {
          throw new Error('Failed to load topics');
        }
        const topics = await response.json();

        if (!topics.length) {
          cards.innerHTML = `
            <div class="empty">
              No topics yet. Add one with <code>python -m bodhi_seer add "Topic name"</code>.
            </div>
          `;
          return;
        }

        cards.innerHTML = topics.map((topic) => `
          <article class="card">
            <h2>${topic.name}</h2>
            <div class="meta">
              <span class="pill">${topic.articles ?? 0} articles</span>
              <span class="pill">Last fetch: ${fmtDate(topic.last_fetched)}</span>
            </div>
            <p class="query"><strong>Query:</strong> ${topic.query || '—'}</p>
            <div class="actions">
              <a class="button" href="/#${topic.id}">Open graph</a>
              <a class="button secondary" href="/">Viewer</a>
              <button class="button delete" type="button" data-delete-id="${topic.id}">Delete</button>
            </div>
          </article>
        `).join('');

        cards.querySelectorAll('[data-delete-id]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-delete-id');
            const name = button.closest('.card')?.querySelector('h2')?.textContent?.trim() || 'this topic';
            if (!window.confirm(`Delete ${name}?`)) {
              return;
            }
            const response = await fetch(`/api/topics/${id}`, { method: 'DELETE' });
            if (!response.ok) {
              alert('Failed to delete topic');
              return;
            }
            await loadTopics();
          });
        });
      } catch (error) {
        cards.innerHTML = `
          <div class="empty">
            Could not load topics. Start the app with <code>python -m bodhi_seer serve</code> and refresh this page.
          </div>
        `;
      }
    }

    document.getElementById('topic-form').addEventListener('submit', createTopic);
    loadTopics();
  </script>
</body>
</html>
